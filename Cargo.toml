[package]
name = "zap-wallet-init-manager"
version = "0.1.0"
edition = "2021"
authors = ["@l3labs.org"]
description = "Channel-based Zap wallet initialization manager"
license = "MIT OR Apache-2.0"

[dependencies]

zap-rs-sdk = { path = "/media/catsper/data6/RPC-TESTING/FF/zap-rpc/crates/zap-rs-sdk" }

# Fuel SDK
fuels = "0.72.0"

tokio = { version = "1.35", features = ["full"] }

anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
hex = "0.4"
rand = "0.8"
prometheus = { version = "0.13", optional = true }

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.0"

[features]
default = []
metrics = ["prometheus"]


